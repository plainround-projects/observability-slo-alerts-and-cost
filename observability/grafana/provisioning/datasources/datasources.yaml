apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      httpMethod: POST
  - name: Prometheus replay
    uid: prometheus-replay
    type: prometheus
    access: proxy
    url: http://prometheus-replay:9090
    jsonData:
      httpMethod: POST
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: "-1m"
        spanEndTimeShift: "1m"
        customQuery: true
        query: '{service_name="checkout"} | trace_id="${__span.traceId}"'
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
