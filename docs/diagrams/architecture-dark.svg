<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="924" viewBox="0 0 1200 924" role="img" aria-labelledby="t d">
<title id="t">Architecture of observability-slo-alerts-and-cost</title>
<desc id="d">Two halves. In the replay half, a Traffic simulator backfills a week into Prometheus replay, a Replay evaluator reads the Threshold alerts and Burn-rate alerts and runs them as range queries, and writes pages to Page analysis. In the live half inside Docker Compose, live traffic posts to the Checkout service, which sends spans, logs and metrics to the Collector gateway. The gateway redacts and tail-samples, sends kept traces to Tempo and redacted logs to Loki, drops the rest, and Prometheus scrapes its metrics, evaluates the burn-rate rules and notifies Alertmanager, which sends a webhook to the Fake pager.</desc>
<style>
